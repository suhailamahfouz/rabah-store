  <style>
    /* Rendered before Angular starts, while a sleeping API wakes up. */
    .backend-splash{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;background:#f3f3f2}
    .backend-splash__icons{display:flex;align-items:center;gap:clamp(14px,5vw,32px);padding:24px}
    .backend-splash svg{width:clamp(42px,12vw,64px);fill:none;stroke:#171717;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:backend-splash-pulse 1.65s ease-in-out infinite both}
    .backend-splash svg:nth-child(2){animation-delay:.14s}.backend-splash svg:nth-child(3){animation-delay:.28s}.backend-splash svg:nth-child(4){animation-delay:.42s}
    @keyframes backend-splash-pulse{0%,100%{opacity:.34;transform:translateY(4px)}45%{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.backend-splash svg{animation:none}}
  </style>
